<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830" role="img" aria-labelledby="title desc">
<title id="title">Wie sich die Prüfungen ergänzen</title>
<desc id="desc">Einzelne Bausteine, vollständige Abläufe und Browserbedienung prüfen verschiedene Fehler. Bei den Abläufen wird zusätzlich der gespeicherte Datenbankzustand nachgeprüft.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="55.00" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#101820" text-anchor="start" dominant-baseline="central">Wie sich die Prüfungen ergänzen</text>
<text x="60" y="112.00" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="start" dominant-baseline="central">Jede Ebene beantwortet eine andere Frage.</text>
<rect x="60" y="170" width="940" height="160" rx="16" fill="#EDF5F5" stroke="#C7D7DC" stroke-width="2"/>
<circle cx="110" cy="214" r="29" fill="#17656B"/>
<text x="110" y="214.00" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">1</text>
<text x="164" y="212.00" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#101820" text-anchor="start" dominant-baseline="central">Einzelne Bausteine prüfen</text>
<text x="164" y="257.00" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="start" dominant-baseline="central">Unit Tests: Stimmt ein einzelner Baustein?</text>
<text x="164" y="296.68" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="start" dominant-baseline="central">Zum Beispiel Berechnung oder Bankprüfung.</text>
<rect x="60" y="360" width="940" height="160" rx="16" fill="#F5F7F8" stroke="#C7D7DC" stroke-width="2"/>
<circle cx="110" cy="404" r="29" fill="#17656B"/>
<text x="110" y="404.00" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">2</text>
<text x="164" y="402.00" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#101820" text-anchor="start" dominant-baseline="central">Ganze Arbeitsabläufe prüfen</text>
<text x="164" y="447.00" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="start" dominant-baseline="central">Ablauftests: Anlegen, Freigeben und Stornieren.</text>
<text x="164" y="486.68" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="start" dominant-baseline="central">Arbeiten die Bausteine richtig zusammen?</text>
<rect x="60" y="550" width="940" height="160" rx="16" fill="#F5F7F8" stroke="#C7D7DC" stroke-width="2"/>
<circle cx="110" cy="594" r="29" fill="#17656B"/>
<text x="110" y="594.00" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">3</text>
<text x="164" y="592.00" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#101820" text-anchor="start" dominant-baseline="central">Die echte Oberfläche bedienen</text>
<text x="164" y="637.00" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="start" dominant-baseline="central">Browsertests: Anmeldung, Formulare und Klicks.</text>
<text x="164" y="676.68" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="start" dominant-baseline="central">Funktioniert der Weg durch die Oberfläche?</text>
<rect x="1110" y="360" width="430" height="350" rx="16" fill="#EDF5F5" stroke="#17656B" stroke-width="2"/>
<text x="1325" y="409.00" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#101820" text-anchor="middle" dominant-baseline="central">SQL Kontrolle</text>
<text x="1325" y="480.00" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#101820" text-anchor="middle" dominant-baseline="central">Datenbank direkt</text>
<text x="1325" y="521.60" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#101820" text-anchor="middle" dominant-baseline="central">nachprüfen</text>
<text x="1325" y="600.00" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="middle" dominant-baseline="central">Was wurde tatsächlich</text>
<text x="1325" y="641.60" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="middle" dominant-baseline="central">gespeichert?</text>
<polyline points="1000,440 1090,440" fill="none" stroke="#17656B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1090.00,440.00 1075.00,432.00 1075.00,448.00" fill="#17656B"/>
<polyline points="1000,630 1090,630" fill="none" stroke="#17656B" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1090.00,630.00 1075.00,622.00 1075.00,638.00" fill="#17656B"/>
<text x="60" y="780.00" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="start" dominant-baseline="central">Die Ebenen prüfen verschiedene Fehler und ergänzen sich.</text>
</svg>
