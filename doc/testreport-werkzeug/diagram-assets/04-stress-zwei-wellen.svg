<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
<title id="title">Zwei Wellen mit einer gemeinsamen Wartephase</title>
<desc id="desc">Mehrere simulierte Sachbearbeiter legen in Welle eins Vorgänge an. Erst wenn alle fertig sind, startet Welle zwei mit Wiederfinden, Ändern und Anordnen. Die Datenbank wird danach direkt nachgeprüft.</desc>
