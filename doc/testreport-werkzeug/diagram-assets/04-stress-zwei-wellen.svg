<text x="60" y="113.00" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#40515D" text-anchor="start" dominant-baseline="central">Dieselben Kennungen bearbeiten dieselben Vorgänge erneut.</text>
<text x="60" y="179.00" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#101820" text-anchor="start" dominant-baseline="central">Welle 1</text>
<text x="980" y="179.00" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#101820" text-anchor="start" dominant-baseline="central">Welle 2</text>
